name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@5.2.0
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and run tests with Maven
        run: mvn --batch-mode verify